[package]
name = "tidy"
version = "1.0.1"
description = "Minimalist cross-platform file organizer"
authors = ["Tidy"]
edition = "2021"
default-run = "tidy"

[lib]
name = "tidy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tidy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
notify = "8.2.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
once_cell = "1.21.4"
parking_lot = "0.13.0"
thiserror = "2.0.21"
zip = "9.4.0"
pdf-extract = "0.12.1"
rayon = "1.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Must be unwind: catch_unwind around pdf-extract is a no-op with panic=abort,
# and corrupt PDFs were aborting the whole app during reorganize.
panic = "unwind"
strip = true
