[package]
name = "tidy-embed-worker"
version = "1.0.1"
edition = "2021"
publish = false

[[bin]]
name = "tidy-embed-worker"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
fastembed = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
